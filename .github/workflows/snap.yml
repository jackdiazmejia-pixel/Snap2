name: Build Snaptube Lite APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Limpiar proyecto viejo
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties

      - name: Aceptar licencias de Android SDK
        run: |
          sudo mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee $ANDROID_HOME/licenses/android-sdk-license > /dev/null
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee $ANDROID_HOME/licenses/android-sdk-preview-license > /dev/null

      - name: Crear configuración de Gradle
        run: |
          mkdir -p app/src/main/java/com/snaptubelite
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnaptubeLite"
          include(":app")
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.snaptubelite"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.snaptubelite"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "2.0"

                  ndk {
                      abiFilters.addAll(listOf("arm64-v8a", "armeabi-v7a"))
                  }
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
                  resources {
                      excludes += setOf(
                          "META-INF/DEPENDENCIES",
                          "META-INF/LICENSE",
                          "META-INF/LICENSE.txt",
                          "META-INF/NOTICE",
                          "META-INF/NOTICE.txt",
                          "META-INF/AL2.0",
                          "META-INF/LGPL2.1"
                      )
                  }
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.4")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.4")
          }
          EOF

      - name: Crear recursos (ícono y colores)
        run: |
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#E53935</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M50,30 L58,30 L58,52 L66,52 L54,68 L42,52 L50,52 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M40,74 L68,74 L68,78 L40,78 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      - name: Crear AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Snaptube Lite"
                  android:theme="@style/Theme.MaterialComponents.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".HistoryActivity" android:exported="false" />

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

      - name: Crear Modelo de Historial
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/DownloadItem.kt
          package com.snaptubelite

          data class DownloadItem(
              val title: String,
              val uri: String,
              val type: String,
              val date: String
          )
          EOF

      - name: Crear HistoryManager (Gestor de SharedPreferences)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/HistoryManager.kt
          package com.snaptubelite

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          object HistoryManager {
              private const val PREF_NAME = "snaptube_history"
              private const val KEY_ITEMS = "items"

              @Synchronized
              fun getHistory(context: Context): MutableList<DownloadItem> {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val jsonStr = prefs.getString(KEY_ITEMS, "[]") ?: "[]"
                  val list = mutableListOf<DownloadItem>()
                  try {
                      val arr = JSONArray(jsonStr)
                      for (i in 0 until arr.length()) {
                          try {
                              val obj = arr.getJSONObject(i)
                              list.add(
                                  DownloadItem(
                                      obj.getString("title"),
                                      obj.getString("uri"),
                                      obj.getString("type"),
                                      obj.getString("date")
                                  )
                              )
                          } catch (_: Exception) {
                              // Entrada con formato viejo o dañada: se omite
                          }
                      }
                  } catch (_: Exception) {}
                  return list
              }

              @Synchronized
              fun addItem(context: Context, item: DownloadItem) {
                  val list = getHistory(context)
                  list.add(0, item)
                  saveHistory(context, list)
              }

              @Synchronized
              fun clearHistory(context: Context) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit().remove(KEY_ITEMS).apply()
              }

              private fun saveHistory(context: Context, list: List<DownloadItem>) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val arr = JSONArray()
                  list.forEach {
                      val obj = JSONObject().apply {
                          put("title", it.title)
                          put("uri", it.uri)
                          put("type", it.type)
                          put("date", it.date)
                      }
                      arr.put(obj)
                  }
                  prefs.edit().putString(KEY_ITEMS, arr.toString()).apply()
              }
          }
          EOF

      - name: Crear Engine (inicialización y actualización de yt-dlp)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/Engine.kt
          package com.snaptubelite

          import android.content.Context
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL

          object Engine {

              @Volatile
              private var ready = false

              /** Prepara yt-dlp y ffmpeg. La primera vez tarda unos segundos (extrae Python). */
              @Synchronized
              fun ensureInit(context: Context) {
                  if (ready) return
                  val app = context.applicationContext
                  YoutubeDL.getInstance().init(app)
                  FFmpeg.getInstance().init(app)
                  ready = true
              }

              /** Descarga la última versión de yt-dlp. Devuelve el estado como texto. */
              fun update(context: Context): String {
                  ensureInit(context)
                  val status = YoutubeDL.getInstance().updateYoutubeDL(
                      context.applicationContext,
                      YoutubeDL.UpdateChannel.STABLE
                  )
                  return status?.toString() ?: "DONE"
              }
          }
          EOF

      - name: Crear DownloadState (estado compartido con la interfaz)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/DownloadState.kt
          package com.snaptubelite

          import android.os.Handler
          import android.os.Looper

          object DownloadState {
              @Volatile var running = false
              @Volatile var cancellable = false
              @Volatile var progress = -1
              @Volatile var status = "Listo para descargar"
              @Volatile var listener: (() -> Unit)? = null

              private val main = Handler(Looper.getMainLooper())

              fun update(
                  running: Boolean = this.running,
                  progress: Int = this.progress,
                  status: String = this.status,
                  cancellable: Boolean = this.cancellable
              ) {
                  this.running = running
                  this.progress = progress
                  this.status = status
                  this.cancellable = cancellable
                  main.post { listener?.invoke() }
              }
          }
          EOF

      - name: Crear Downloader (descarga real con yt-dlp)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/Downloader.kt
          package com.snaptubelite

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.util.Locale

          object Downloader {

              class Result(val name: String, val uri: Uri)

              val videoOptions = listOf(
                  "Mejor calidad disponible",
                  "1080p (Full HD)",
                  "720p (HD)",
                  "480p",
                  "360p"
              )
              private val videoHeights = listOf(0, 1080, 720, 480, 360)

              val audioOptions = listOf(
                  "MP3 - 320 kbps (Máxima)",
                  "MP3 - 192 kbps",
                  "MP3 - 128 kbps",
                  "M4A - Calidad original"
              )

              @Volatile
              private var currentProcessId: String? = null

              @Volatile
              var cancelled = false
                  private set

              private val extMime = mapOf(
                  "mp4" to "video/mp4",
                  "mkv" to "video/x-matroska",
                  "webm" to "video/webm",
                  "3gp" to "video/3gpp",
                  "mov" to "video/quicktime",
                  "mp3" to "audio/mpeg",
                  "m4a" to "audio/mp4",
                  "aac" to "audio/aac",
                  "wav" to "audio/wav",
                  "ogg" to "audio/ogg",
                  "opus" to "audio/ogg",
                  "flac" to "audio/flac"
              )

              /** Cancela la descarga en curso. Llamar desde un hilo en segundo plano. */
              fun cancel() {
                  cancelled = true
                  val id = currentProcessId ?: return
                  try {
                      YoutubeDL.getInstance().destroyProcessById(id)
                  } catch (_: Exception) {}
              }

              /** Extrae una línea de error legible del mensaje largo de yt-dlp. */
              fun cleanError(e: Throwable): String {
                  val raw = e.message ?: return "Error desconocido"
                  val lines = raw.lines()
                  val line = lines.lastOrNull { it.contains("ERROR", ignoreCase = true) }
                      ?: lines.lastOrNull { it.isNotBlank() }
                      ?: raw
                  return line.replace("ERROR:", "").trim().take(300)
              }

              /**
               * Descarga con yt-dlp a una carpeta temporal de la app y luego copia el resultado
               * a Movies/SnaptubeLite o Music/SnaptubeLite con MediaStore.
               * Debe llamarse desde un hilo en segundo plano.
               * onStatus recibe (porcentaje 0..100 o -1 si es indeterminado, texto).
               */
              fun download(
                  context: Context,
                  url: String,
                  type: String,
                  optionIndex: Int,
                  onStatus: (Int, String) -> Unit
              ): Result {
                  cancelled = false
                  val resolver = context.contentResolver
                  val root = File(context.getExternalFilesDir(null) ?: context.filesDir, "tmp")
                  root.deleteRecursively()
                  root.mkdirs()

                  try {
                      val request = YoutubeDLRequest(url)
                      request.addOption("-o", root.absolutePath + "/%(title).80s.%(ext)s")
                      request.addOption("--no-playlist")
                      request.addOption("--no-mtime")

                      if (type == "Video") {
                          val h = videoHeights.getOrElse(optionIndex) { 0 }
                          val format = if (h == 0) {
                              "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b"
                          } else {
                              "bv*[height<=$h][ext=mp4]+ba[ext=m4a]/b[height<=$h][ext=mp4]/" +
                                  "bv*[height<=$h]+ba/b[height<=$h]/b"
                          }
                          request.addOption("-f", format)
                          request.addOption("--merge-output-format", "mp4")
                      } else {
                          request.addOption("-f", "ba/b")
                          request.addOption("-x")
                          when (optionIndex) {
                              0 -> {
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", "320K")
                              }
                              1 -> {
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", "192K")
                              }
                              2 -> {
                                  request.addOption("--audio-format", "mp3")
                                  request.addOption("--audio-quality", "128K")
                              }
                              else -> request.addOption("--audio-format", "m4a")
                          }
                      }

                      val processId = "snaptube_" + System.currentTimeMillis()
                      currentProcessId = processId
                      onStatus(-1, "Conectando...")
                      try {
                          YoutubeDL.getInstance().execute(request, processId) { progress, _, _ ->
                              val pct = progress.toInt().coerceIn(0, 100)
                              onStatus(
                                  pct,
                                  if (pct >= 100) "Procesando archivo..." else "Descargando... $pct%"
                              )
                          }
                      } finally {
                          currentProcessId = null
                      }

                      if (cancelled) throw Exception("Descarga cancelada")

                      val file = root.listFiles()
                          ?.filter { it.isFile && extMime.containsKey(it.extension.lowercase(Locale.ROOT)) }
                          ?.maxByOrNull { it.length() }
                          ?: throw Exception(
                              "No se generó ningún archivo. El sitio pudo haber bloqueado la descarga."
                          )

                      onStatus(100, "Guardando en el teléfono...")

                      val mime = extMime.getValue(file.extension.lowercase(Locale.ROOT))
                      val isAudio = mime.startsWith("audio/")
                      val collection = if (isAudio) {
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                      } else {
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                      }
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, file.name)
                          put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          put(
                              MediaStore.MediaColumns.RELATIVE_PATH,
                              if (isAudio) "Music/SnaptubeLite" else "Movies/SnaptubeLite"
                          )
                          put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = resolver.insert(collection, values)
                          ?: throw Exception("No se pudo crear el archivo final")

                      try {
                          resolver.openOutputStream(uri)?.use { out ->
                              file.inputStream().use { input -> input.copyTo(out, 64 * 1024) }
                          } ?: throw Exception("No se pudo abrir el archivo de destino")

                          val done = ContentValues().apply {
                              put(MediaStore.MediaColumns.IS_PENDING, 0)
                          }
                          resolver.update(uri, done, null, null)
                      } catch (e: Exception) {
                          try {
                              resolver.delete(uri, null, null)
                          } catch (_: Exception) {}
                          throw e
                      }

                      // Android puede renombrar el archivo si ya existía uno igual
                      val finalName = try {
                          resolver.query(
                              uri,
                              arrayOf(MediaStore.MediaColumns.DISPLAY_NAME),
                              null, null, null
                          )?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
                      } catch (_: Exception) {
                          null
                      } ?: file.name

                      return Result(finalName, uri)
                  } finally {
                      root.deleteRecursively()
                  }
              }
          }
          EOF

      - name: Crear DownloadService (descarga en segundo plano)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/DownloadService.kt
          package com.snaptubelite

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class DownloadService : Service() {

              companion object {
                  const val EXTRA_URL = "url"
                  const val EXTRA_TYPE = "type"
                  const val EXTRA_INDEX = "index"
                  private const val CHANNEL_ID = "snaptube_downloads"
                  private const val NOTIF_PROGRESS = 1
                  private const val NOTIF_DONE = 2
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createChannel()
                  startForeground(
                      NOTIF_PROGRESS,
                      progressNotification("Preparando descarga...", -1),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )

                  val url = intent?.getStringExtra(EXTRA_URL)
                  val type = intent?.getStringExtra(EXTRA_TYPE)
                  val index = intent?.getIntExtra(EXTRA_INDEX, 0) ?: 0
                  if (url == null || type == null) {
                      DownloadState.update(running = false, cancellable = false)
                      finishService()
                      return START_NOT_STICKY
                  }

                  val appContext = applicationContext
                  val nm = getSystemService(NotificationManager::class.java)
                  DownloadState.update(
                      running = true,
                      progress = -1,
                      status = "Preparando motor...",
                      cancellable = true
                  )

                  Thread {
                      try {
                          Engine.ensureInit(appContext)
                          val result = Downloader.download(appContext, url, type, index) { pct, text ->
                              DownloadState.update(progress = pct, status = text)
                              nm.notify(NOTIF_PROGRESS, progressNotification(text, pct))
                          }
                          val dateStr = SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.getDefault()).format(Date())
                          HistoryManager.addItem(
                              appContext,
                              DownloadItem(result.name, result.uri.toString(), type, dateStr)
                          )
                          val msg = "✅ Descarga completada: ${result.name}"
                          DownloadState.update(running = false, progress = 100, status = msg, cancellable = false)
                          finishService()
                          nm.notify(NOTIF_DONE, doneNotification("Descarga completada", result.name))
                      } catch (e: Exception) {
                          val msg = if (Downloader.cancelled) {
                              "Descarga cancelada"
                          } else {
                              Downloader.cleanError(e)
                          }
                          DownloadState.update(running = false, progress = -1, status = "❌ $msg", cancellable = false)
                          finishService()
                          if (!Downloader.cancelled) {
                              nm.notify(NOTIF_DONE, doneNotification("Error en la descarga", msg))
                          }
                      }
                  }.start()

                  return START_NOT_STICKY
              }

              private fun finishService() {
                  Handler(Looper.getMainLooper()).post {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  }
              }

              private fun createChannel() {
                  val channel = NotificationChannel(
                      CHANNEL_ID,
                      "Descargas",
                      NotificationManager.IMPORTANCE_LOW
                  )
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
              }

              private fun openAppIntent(): PendingIntent =
                  PendingIntent.getActivity(
                      this,
                      0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE
                  )

              private fun progressNotification(text: String, pct: Int): Notification =
                  NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle("Snaptube Lite")
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setProgress(100, pct.coerceAtLeast(0), pct < 0)
                      .setContentIntent(openAppIntent())
                      .build()

              private fun doneNotification(title: String, text: String): Notification =
                  NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setAutoCancel(true)
                      .setContentIntent(openAppIntent())
                      .build()
          }
          EOF

      - name: Crear MainActivity (Pantalla principal de descargas)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/MainActivity.kt
          package com.snaptubelite

          import android.Manifest
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var urlInput: EditText
              private lateinit var status: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var btnVideo: Button
              private lateinit var btnAudio: Button
              private lateinit var btnCancel: Button
              private lateinit var btnUpdate: Button

              private val urlRegex = Regex("https?://\\S+")

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }

                  val title = TextView(this).apply {
                      text = "Snaptube Lite"
                      setTextColor(Color.WHITE)
                      textSize = 22f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, dp(10), 0, dp(16))
                  }
                  root.addView(title)

                  urlInput = EditText(this).apply {
                      hint = "Pega el enlace (YouTube, Facebook, TikTok...)"
                      setHintTextColor(Color.parseColor("#777777"))
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#111111"))
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      textSize = 14f
                  }
                  root.addView(urlInput, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(0, 0, 0, dp(14)) })

                  btnVideo = makeButton("📥 Descargar Video", "#222222", "#FFFFFF") {
                      chooseQuality("Video")
                  }
                  root.addView(btnVideo, buttonParams())

                  btnAudio = makeButton("🎵 Descargar Audio", "#222222", "#FFFFFF") {
                      chooseQuality("Audio")
                  }
                  root.addView(btnAudio, buttonParams())

                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      visibility = View.GONE
                  }
                  root.addView(progressBar, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(0, dp(4), 0, dp(4)) })

                  status = TextView(this).apply {
                      text = DownloadState.status
                      setTextColor(Color.parseColor("#AAAAAA"))
                      textSize = 13f
                      setPadding(dp(4), dp(4), dp(4), dp(10))
                  }
                  root.addView(status)

                  btnCancel = makeButton("⏹ Cancelar descarga", "#442200", "#FFAA55") {
                      Thread { Downloader.cancel() }.start()
                  }
                  btnCancel.visibility = View.GONE
                  root.addView(btnCancel, buttonParams())

                  val btnHistory = makeButton("📂 Historial de Descargas", "#151515", "#FFFFFF") {
                      startActivity(Intent(this@MainActivity, HistoryActivity::class.java))
                  }
                  root.addView(btnHistory, buttonParams())

                  btnUpdate = makeButton("🔄 Actualizar motor (yt-dlp)", "#151515", "#FFFFFF") {
                      updateEngine()
                  }
                  root.addView(btnUpdate, buttonParams())

                  val btnExit = makeButton("❌ Salir de la Aplicación", "#330000", "#FF6666") {
                      finishAffinity()
                  }
                  root.addView(btnExit, buttonParams())

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.BLACK)
                      isFillViewport = true
                      addView(root)
                  }
                  setContentView(scroll)

                  requestNotificationPermission()
                  handleShareIntent(intent)

                  // Prepara yt-dlp en segundo plano para que la primera descarga arranque más rápido
                  val appContext = applicationContext
                  Thread {
                      try {
                          Engine.ensureInit(appContext)
                      } catch (_: Exception) {}
                  }.start()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleShareIntent(intent)
              }

              override fun onStart() {
                  super.onStart()
                  DownloadState.listener = { render() }
                  render()
              }

              override fun onStop() {
                  super.onStop()
                  DownloadState.listener = null
              }

              private fun render() {
                  val running = DownloadState.running
                  status.text = DownloadState.status
                  btnVideo.isEnabled = !running
                  btnAudio.isEnabled = !running
                  btnUpdate.isEnabled = !running
                  btnCancel.visibility = if (running && DownloadState.cancellable) View.VISIBLE else View.GONE
                  progressBar.visibility = if (running) View.VISIBLE else View.GONE
                  if (DownloadState.progress < 0) {
                      progressBar.isIndeterminate = true
                  } else {
                      progressBar.isIndeterminate = false
                      progressBar.progress = DownloadState.progress
                  }
              }

              private fun buttonParams() = LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  dp(56)
              ).apply { setMargins(0, 0, 0, dp(10)) }

              private fun makeButton(label: String, bg: String, fg: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      setBackgroundColor(Color.parseColor(bg))
                      setTextColor(Color.parseColor(fg))
                      setOnClickListener { onClick() }
                  }
              }

              private fun toast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }

              private fun requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 100)
                  }
              }

              // Permite compartir un enlace desde otra app (YouTube, Facebook...) hacia Snaptube Lite
              private fun handleShareIntent(intent: Intent?) {
                  if (intent?.action == Intent.ACTION_SEND && intent.type == "text/plain") {
                      val shared = intent.getStringExtra(Intent.EXTRA_TEXT)
                      val url = shared?.let { urlRegex.find(it)?.value }
                      if (url != null) {
                          urlInput.setText(url)
                          toast("Enlace recibido")
                      }
                  }
              }

              // El portapapeles solo se puede leer cuando la app tiene el foco
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus || !::urlInput.isInitialized) return
                  try {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = clipboard.primaryClip
                      if (clip != null && clip.itemCount > 0 && urlInput.text.isEmpty()) {
                          val pasted = clip.getItemAt(0).coerceToText(this).toString()
                          val url = urlRegex.find(pasted)?.value
                          if (url != null) {
                              urlInput.setText(url)
                              toast("Enlace detectado del portapapeles")
                          }
                      }
                  } catch (_: Exception) {}
              }

              private fun chooseQuality(type: String) {
                  if (DownloadState.running) {
                      toast("Ya hay una operación en curso")
                      return
                  }
                  val url = urlRegex.find(urlInput.text.toString())?.value
                  if (url == null) {
                      toast("Pega un enlace válido primero")
                      return
                  }
                  val options = if (type == "Video") Downloader.videoOptions else Downloader.audioOptions
                  AlertDialog.Builder(this)
                      .setTitle(if (type == "Video") "Elegir calidad de video" else "Elegir formato de audio")
                      .setItems(options.toTypedArray()) { _, which ->
                          launchDownload(url, type, which)
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun launchDownload(url: String, type: String, index: Int) {
                  if (DownloadState.running) return
                  DownloadState.update(
                      running = true,
                      progress = -1,
                      status = "Iniciando...",
                      cancellable = true
                  )
                  val intent = Intent(this, DownloadService::class.java).apply {
                      putExtra(DownloadService.EXTRA_URL, url)
                      putExtra(DownloadService.EXTRA_TYPE, type)
                      putExtra(DownloadService.EXTRA_INDEX, index)
                  }
                  ContextCompat.startForegroundService(this, intent)
                  urlInput.setText("")
              }

              private fun updateEngine() {
                  if (DownloadState.running) return
                  DownloadState.update(
                      running = true,
                      progress = -1,
                      status = "Actualizando motor yt-dlp...",
                      cancellable = false
                  )
                  val appContext = applicationContext
                  Thread {
                      try {
                          val result = Engine.update(appContext)
                          val msg = if (result.contains("ALREADY", ignoreCase = true)) {
                              "✅ El motor ya estaba actualizado"
                          } else {
                              "✅ Motor actualizado"
                          }
                          DownloadState.update(running = false, progress = -1, status = msg, cancellable = false)
                      } catch (e: Exception) {
                          DownloadState.update(
                              running = false,
                              progress = -1,
                              status = "❌ No se pudo actualizar: ${Downloader.cleanError(e)}",
                              cancellable = false
                          )
                      }
                  }.start()
              }
          }
          EOF

      - name: Crear HistoryActivity (Historial y reproducción externa)
        run: |
          cat << 'EOF' > app/src/main/java/com/snaptubelite/HistoryActivity.kt
          package com.snaptubelite

          import android.content.ActivityNotFoundException
          import android.content.ClipData
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity

          class HistoryActivity : AppCompatActivity() {

              private lateinit var container: LinearLayout

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                  }

                  val toolbar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(16), dp(20), dp(16), dp(12))
                      setBackgroundColor(Color.BLACK)
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val title = TextView(this).apply {
                      text = "Historial de Descargas"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  toolbar.addView(title)

                  val btnClear = TextView(this).apply {
                      text = "🗑 Limpiar"
                      setTextColor(Color.parseColor("#FF6666"))
                      textSize = 14f
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      setOnClickListener {
                          AlertDialog.Builder(this@HistoryActivity)
                              .setTitle("Limpiar historial")
                              .setMessage("¿Deseas vaciar todo el historial? Los archivos descargados no se borran.")
                              .setPositiveButton("Sí") { _, _ ->
                                  HistoryManager.clearHistory(this@HistoryActivity)
                                  loadHistoryList()
                              }
                              .setNegativeButton("No", null)
                              .show()
                      }
                  }
                  toolbar.addView(btnClear)
                  root.addView(toolbar)

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }

                  container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }
                  scrollView.addView(container)
                  root.addView(scrollView)

                  setContentView(root)
                  loadHistoryList()
              }

              override fun onResume() {
                  super.onResume()
                  loadHistoryList()
              }

              private fun loadHistoryList() {
                  container.removeAllViews()
                  val list = HistoryManager.getHistory(this)

                  if (list.isEmpty()) {
                      val emptyTv = TextView(this).apply {
                          text = "No hay descargas recientes"
                          setTextColor(Color.parseColor("#777777"))
                          textSize = 14f
                          gravity = Gravity.CENTER
                          setPadding(0, dp(48), 0, 0)
                      }
                      container.addView(emptyTv)
                      return
                  }

                  list.forEach { item ->
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setBackgroundColor(Color.parseColor("#111111"))
                          setPadding(dp(12), dp(12), dp(12), dp(12))
                          layoutParams = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { setMargins(0, 0, 0, dp(8)) }
                          setOnClickListener { openWithExternalPlayer(item) }
                      }

                      val nameTv = TextView(this).apply {
                          text = item.title
                          setTextColor(Color.WHITE)
                          textSize = 15f
                          setTypeface(null, Typeface.BOLD)
                      }
                      card.addView(nameTv)

                      val infoTv = TextView(this).apply {
                          text = "Tipo: ${item.type}  •  ${item.date}"
                          setTextColor(Color.parseColor("#888888"))
                          textSize = 12f
                          setPadding(0, dp(3), 0, 0)
                      }
                      card.addView(infoTv)

                      container.addView(card)
                  }
              }

              private fun openWithExternalPlayer(item: DownloadItem) {
                  val uri = Uri.parse(item.uri)

                  val exists = try {
                      contentResolver.openFileDescriptor(uri, "r")?.use { true } ?: false
                  } catch (_: Exception) {
                      false
                  }
                  if (!exists) {
                      Toast.makeText(this, "El archivo ya no existe en la memoria", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val mime = contentResolver.getType(uri)
                      ?: if (item.type == "Video") "video/*" else "audio/*"

                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, mime)
                      clipData = ClipData.newRawUri("", uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  try {
                      startActivity(Intent.createChooser(intent, "Reproducir con..."))
                  } catch (_: ActivityNotFoundException) {
                      Toast.makeText(this, "No hay ninguna app para reproducir este archivo", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

